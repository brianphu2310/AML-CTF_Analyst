name: Probe sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p docs
          curl -sL -m 60 -A "aml-portfolio-ingest/0.1 (https://github.com/brianphu2310/AML-CTF_Analyst)" https://scsanctions.un.org/resources/xml/en/consolidated.xml -o /tmp/un.xml
          curl -sI -m 20 https://scsanctions.un.org/robots.txt | head -3 > /tmp/robots_head.txt; curl -sL -m 20 https://scsanctions.un.org/robots.txt | head -15 >> /tmp/robots_head.txt
          python3 - <<'PY' > docs/PROBE.md
          import collections, xml.etree.ElementTree as ET
          t=ET.parse('/tmp/un.xml'); r=t.getroot()
          print('# probe'); print('root', r.tag, r.attrib)
          c=collections.Counter(); 
          for e in r.iter(): c[e.tag]+=1
          for k,v in c.items(): print(k,v)
          for sec in ('INDIVIDUAL','ENTITY'):
              e=next(r.iter(sec)); print('---',sec); print(ET.tostring(e,encoding='unicode')[:2500])
          PY
          { echo '--- robots'; cat /tmp/robots_head.txt; } >> docs/PROBE.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROBE.md; git commit -m "Probe output"; git pull --rebase -q; git push
